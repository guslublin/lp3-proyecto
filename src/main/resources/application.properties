spring.application.name=lp3-proyecto

# ── Conexión a PostgreSQL ─────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/lp3_db
spring.datasource.username=postgres
spring.datasource.password=postgres
# ── Comportamiento del esquema ────────────────────────────────
# update: crea o actualiza las tablas al arrancar la aplicación
spring.jpa.hibernate.ddl-auto=update
# ── Diagnóstico ─────────────────────────────────────────────────
# true: muestra las sentencias SQL generadas en la consola
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Open EntityManager in View
spring.jpa.open-in-view=false
